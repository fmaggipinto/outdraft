# Netlify builds the web app in web/. Commits that only touch data/ (the Model
# job's hourly output) skip the build: the app reads data/ from GitHub directly.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"

[functions]
  directory = "netlify/functions"

# The deadlines calendar feed (web/netlify/functions/deadlines.mts).
[[redirects]]
  from = "/deadlines.ics"
  to = "/.netlify/functions/deadlines"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
